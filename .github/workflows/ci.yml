name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── PHP Lint (PHPCS) ────────────────────────────────────────────────────────
  phpcs:
    name: PHPCS (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPCS
        run: composer lint

  # ── PHPUnit (unit on host + integration via wp-env) ─────────────────────────
  phpunit:
    name: PHPUnit (${{ matrix.php }} / WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2"]
        wp:  ["latest"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Setup Node.js (for wp-env)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit (unit suite)
        run: ./vendor/bin/phpunit --testsuite unit --no-coverage

      - name: Install @wordpress/env
        id: wp-env-install
        run: npm install -g @wordpress/env

      - name: Start wp-env
        run: wp-env start

      - name: Run PHPUnit (integration suite)
        run: |
          wp-env run tests-cli \
            --env-cwd=wp-content/plugins/rest-cache-invalidation \
            ./vendor/bin/phpunit \
            --testsuite integration \
            --no-coverage

      - name: Stop wp-env
        if: ${{ always() && steps.wp-env-install.outcome == 'success' }}
        run: wp-env stop
